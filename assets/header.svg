<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Samuele Scavello — Head of Development" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="g1" cx="88%" cy="0%" r="60%">
      <stop offset="0" stop-color="#c4f542" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c4f542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0%" cy="100%" r="55%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .k{fill:#ff8f5a}.s{fill:#c4f542}.p{fill:#f5f5f7}.c{fill:#6b6b75}.n{fill:#a1a1aa}
    .line{font-size:15px}
    /* ogni riga si "scrive" allargando la sua maschera; ciclo di 14s */
    .m{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:type 14s steps(28,end) infinite}
    .m1{animation-delay:0s}.m2{animation-delay:.7s}.m3{animation-delay:1.4s}.m4{animation-delay:2.1s}
    .m5{animation-delay:2.8s}.m6{animation-delay:3.5s}.m7{animation-delay:4.2s}.m8{animation-delay:4.9s}
    @keyframes type{0%{transform:scaleX(0)}6%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}94%{opacity:0}100%{transform:scaleX(1);opacity:0}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
    .r1{animation-delay:.2s}.r2{animation-delay:.45s}.r3{animation-delay:.7s}.r4{animation-delay:.95s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .ok{opacity:0;animation:ok 14s infinite}
    @keyframes ok{0%,40%{opacity:0}44%,88%{opacity:1}94%,100%{opacity:0}}
    .bar{transform-box:fill-box;transform-origin:left center;animation:load 14s infinite}
    @keyframes load{0%,36%{transform:scaleX(0)}42%,88%{transform:scaleX(1)}94%,100%{transform:scaleX(1);opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0a0a0b"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#g1)"/>
    <rect width="1200" height="420" fill="url(#g2)"/>
  </g>

  <!-- Colonna sinistra: chi sono -->
  <g class="sans" transform="translate(56 0)">
    <g class="rise r1">
      <rect x="0" y="64" width="286" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
      <circle class="dot" cx="20" cy="81" r="5" fill="#c4f542"/>
      <text class="mono" x="34" y="86" font-size="14" fill="#a1a1aa">Head of Development · Milano</text>
    </g>
    <text class="rise r2" x="0" y="168" font-size="62" font-weight="800" fill="url(#title)" letter-spacing="-2">SAMUELE</text>
    <text class="rise r2" x="0" y="230" font-size="62" font-weight="800" fill="url(#title)" letter-spacing="-2">SCAVELLO</text>
    <text class="rise r3" x="0" y="280" font-size="18" fill="#a1a1aa">Dirigo il team di sviluppo di Capital Investment</text>
    <text class="rise r3" x="0" y="306" font-size="18" fill="#a1a1aa">e Ristrutturazioni Pro.</text>
    <text class="rise r4" x="0" y="346" font-size="18" fill="#f5f5f7">Stiamo costruendo <tspan fill="#c4f542" font-weight="700">AgenzAI</tspan>.</text>
  </g>

  <!-- Colonna destra: editor che scrive codice -->
  <g transform="translate(560 44)">
    <rect width="600" height="332" rx="16" fill="#111114" stroke="#ffffff" stroke-opacity=".1"/>
    <path d="M16 0h568a16 16 0 0 1 16 16v26H0V16A16 16 0 0 1 16 0z" fill="#17171c"/>
    <circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="42" cy="21" r="6" fill="#febc2e"/><circle cx="62" cy="21" r="6" fill="#28c840"/>
    <text class="mono" x="300" y="26" font-size="13" fill="#6b6b75" text-anchor="middle">samuele.ts</text>

    <g class="mono line" transform="translate(20 76)">
      <defs>
        <clipPath id="l1"><rect class="m m1" x="30" y="-16" width="560" height="22"/></clipPath>
        <clipPath id="l2"><rect class="m m2" x="30" y="10" width="560" height="22"/></clipPath>
        <clipPath id="l3"><rect class="m m3" x="30" y="36" width="560" height="22"/></clipPath>
        <clipPath id="l4"><rect class="m m4" x="30" y="62" width="560" height="22"/></clipPath>
        <clipPath id="l5"><rect class="m m5" x="30" y="88" width="560" height="22"/></clipPath>
        <clipPath id="l6"><rect class="m m6" x="30" y="114" width="560" height="22"/></clipPath>
        <clipPath id="l7"><rect class="m m7" x="30" y="140" width="560" height="22"/></clipPath>
        <clipPath id="l8"><rect class="m m8" x="30" y="166" width="560" height="22"/></clipPath>
      </defs>
      <g fill="#3a3a42" font-size="14"><text x="0" y="0">1</text><text x="0" y="26">2</text><text x="0" y="52">3</text><text x="0" y="78">4</text><text x="0" y="104">5</text><text x="0" y="130">6</text><text x="0" y="156">7</text><text x="0" y="182">8</text></g>
      <text clip-path="url(#l1)" x="34" y="0"><tspan class="k">const</tspan><tspan class="p"> samuele = {</tspan></text>
      <text clip-path="url(#l2)" x="34" y="26"><tspan class="n">  ruolo: </tspan><tspan class="s">"Head of Development"</tspan><tspan class="p">,</tspan></text>
      <text clip-path="url(#l3)" x="34" y="52"><tspan class="n">  team: </tspan><tspan class="p">[</tspan><tspan class="s">"Capital Investment"</tspan><tspan class="p">, </tspan><tspan class="s">"Ristrutturazioni Pro"</tspan><tspan class="p">],</tspan></text>
      <text clip-path="url(#l4)" x="34" y="78"><tspan class="n">  stack: </tspan><tspan class="p">[</tspan><tspan class="s">"React"</tspan><tspan class="p">, </tspan><tspan class="s">"TypeScript"</tspan><tspan class="p">, </tspan><tspan class="s">"Supabase"</tspan><tspan class="p">],</tspan></text>
      <text clip-path="url(#l5)" x="34" y="104"><tspan class="n">  staCostruendo: </tspan><tspan class="s">"AgenzAI"</tspan><tspan class="p">,</tspan></text>
      <text clip-path="url(#l6)" x="34" y="130"><tspan class="n">  ai: </tspan><tspan class="p">[</tspan><tspan class="s">"LLM"</tspan><tspan class="p">, </tspan><tspan class="s">"automazioni"</tspan><tspan class="p">, </tspan><tspan class="s">"agenti"</tspan><tspan class="p">],</tspan></text>
      <text clip-path="url(#l7)" x="34" y="156"><tspan class="p">};</tspan></text>
      <text clip-path="url(#l8)" x="34" y="182"><tspan class="c">// dal lavoro sul campo alla produzione</tspan></text>
    </g>

    <!-- barra "deploy" -->
    <g transform="translate(20 286)">
      <rect width="560" height="4" rx="2" fill="#ffffff" fill-opacity=".06"/>
      <rect class="bar" width="560" height="4" rx="2" fill="#c4f542"/>
      <text class="mono ok" x="0" y="28" font-size="14" fill="#c4f542">✓ build riuscita · deploy in produzione</text>
      <rect class="cursor" x="552" y="16" width="8" height="16" fill="#c4f542"/>
    </g>
  </g>
</svg>
