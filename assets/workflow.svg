<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Dal ramo di sviluppo alla produzione" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:16px}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .pr{fill:#c4f542}.cmd{fill:#f5f5f7}.out{fill:#8b8b95}.ok{fill:#c4f542}.or{fill:#ff8f5a}
    .m{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:type 12s steps(30,end) infinite}
    .o{opacity:0;animation:show 12s infinite}
    .d1{animation-delay:0s}.d2{animation-delay:1.2s}.d3{animation-delay:2.4s}.d4{animation-delay:3.6s}.d5{animation-delay:4.8s}.d6{animation-delay:6s}
    @keyframes type{0%{transform:scaleX(0);opacity:1}7%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
    @keyframes show{0%,6%{opacity:0}9%,88%{opacity:1}95%,100%{opacity:0}}
    .step{opacity:.25;animation:lit 12s infinite}
    .s1{animation-delay:.6s}.s2{animation-delay:1.8s}.s3{animation-delay:3s}.s4{animation-delay:4.2s}.s5{animation-delay:5.4s}
    @keyframes lit{0%{opacity:.25}4%,86%{opacity:1}95%,100%{opacity:.25}}
    .flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
  </style>
  <rect width="1200" height="300" rx="20" fill="#0a0a0b"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- terminale -->
  <g transform="translate(32 32)">
    <rect width="620" height="236" rx="14" fill="#111114" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/><circle cx="38" cy="20" r="5.5" fill="#febc2e"/><circle cx="56" cy="20" r="5.5" fill="#28c840"/>
    <text class="mono" x="310" y="25" font-size="13" fill="#6b6b75" text-anchor="middle">zsh — progetto</text>
    <defs>
      <clipPath id="c1"><rect class="m d1" x="20" y="44" width="580" height="24"/></clipPath>
      <clipPath id="c2"><rect class="m d2" x="20" y="74" width="580" height="24"/></clipPath>
      <clipPath id="c3"><rect class="m d3" x="20" y="104" width="580" height="24"/></clipPath>
      <clipPath id="c4"><rect class="m d4" x="20" y="134" width="580" height="24"/></clipPath>
      <clipPath id="c5"><rect class="m d5" x="20" y="164" width="580" height="24"/></clipPath>
      <clipPath id="c6"><rect class="m d6" x="20" y="194" width="580" height="24"/></clipPath>
    </defs>
    <text class="mono" clip-path="url(#c1)" x="22" y="62"><tspan class="pr">❯ </tspan><tspan class="cmd">git checkout -b feat/nuova-funzione</tspan></text>
    <text class="mono" clip-path="url(#c2)" x="22" y="92"><tspan class="pr">❯ </tspan><tspan class="cmd">npm run build</tspan><tspan class="ok">  ✓ compilato</tspan></text>
    <text class="mono" clip-path="url(#c3)" x="22" y="122"><tspan class="pr">❯ </tspan><tspan class="cmd">git push origin dev</tspan></text>
    <text class="mono" clip-path="url(#c4)" x="22" y="152"><tspan class="or">● </tspan><tspan class="out">revisione del codice: approvata</tspan></text>
    <text class="mono" clip-path="url(#c5)" x="22" y="182"><tspan class="pr">❯ </tspan><tspan class="cmd">git merge dev</tspan><tspan class="out"> → main</tspan></text>
    <text class="mono" clip-path="url(#c6)" x="22" y="212"><tspan class="ok">✓ deploy in produzione · il team lo usa oggi</tspan></text>
  </g>

  <!-- pipeline -->
  <g class="sans" transform="translate(700 58)">
    <text x="0" y="0" font-size="13" fill="#6b6b75" letter-spacing="2">COME LAVORIAMO</text>
    <line class="flow" x1="12" y1="40" x2="12" y2="200" stroke="#c4f542" stroke-opacity=".5" stroke-width="2"/>
    <g class="step s1"><circle cx="12" cy="40" r="9" fill="#0a0a0b" stroke="#c4f542" stroke-width="2"/><text x="36" y="46" font-size="18" fill="#f5f5f7" font-weight="600">Ascolto</text><text x="152" y="46" font-size="15" fill="#8b8b95">chi usa il software</text></g>
    <g class="step s2"><circle cx="12" cy="80" r="9" fill="#0a0a0b" stroke="#c4f542" stroke-width="2"/><text x="36" y="86" font-size="18" fill="#f5f5f7" font-weight="600">Priorità</text><text x="152" y="86" font-size="15" fill="#8b8b95">cosa conta di più</text></g>
    <g class="step s3"><circle cx="12" cy="120" r="9" fill="#0a0a0b" stroke="#c4f542" stroke-width="2"/><text x="36" y="126" font-size="18" fill="#f5f5f7" font-weight="600">Sviluppo</text><text x="152" y="126" font-size="15" fill="#8b8b95">ramo dev, test</text></g>
    <g class="step s4"><circle cx="12" cy="160" r="9" fill="#0a0a0b" stroke="#ff8f5a" stroke-width="2"/><text x="36" y="166" font-size="18" fill="#f5f5f7" font-weight="600">Revisione</text><text x="152" y="166" font-size="15" fill="#8b8b95">ogni modifica</text></g>
    <g class="step s5"><circle cx="12" cy="200" r="9" fill="#c4f542"/><text x="36" y="206" font-size="18" fill="#f5f5f7" font-weight="600">Rilascio</text><text x="152" y="206" font-size="15" fill="#8b8b95">in produzione</text></g>
  </g>
</svg>
