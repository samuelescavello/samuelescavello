name: Serpente dei contributi

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#c4f542&color_dots=#161b22,#2b3a12,#4d6b16,#8bbf2a,#c4f542
            dist/snake-light.svg?color_snake=#4d6b16&color_dots=#ebedf0,#d9f0a3,#addd8e,#78c679,#31a354

      - name: Pubblica sul ramo output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Serpente dei contributi aggiornato"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
