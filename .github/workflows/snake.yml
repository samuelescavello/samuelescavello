name: Serpente dei contributi

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#c4f542&color_dots=#161b22,#2b3a12,#4d6b16,#8bbf2a,#c4f542
            dist/snake-light.svg?color_snake=#4d6b16&color_dots=#ebedf0,#d9f0a3,#addd8e,#78c679,#31a354

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
